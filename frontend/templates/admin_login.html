{% extends "base.html" %}

{% block title %}تسجيل دخول الأدمن | بارتي ماجيك{% endblock %}

{% block content %}

<section class="py-20 min-h-[calc(100vh-200px)] flex items-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            <div class="glass-card p-8 md:p-10" data-aos="zoom-in">
                <div class="text-center mb-8">
                    <div class="text-6xl mb-3">🔐</div>
                    <h1 class="font-fredoka text-3xl font-bold mb-2">لوحة الإدارة</h1>
                    <p class="text-gray-600">سجل دخولك للوصول إلى لوحة التحكم</p>
                </div>

                {% if error %}
                <div class="bg-red-50 border-2 border-red-200 text-red-700 rounded-2xl p-4 mb-5 flex items-center gap-3">
                    <i class="fas fa-exclamation-circle text-xl"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" action="/admin/login" class="space-y-4">
                    <div>
                        <label class="input-label">👤 اسم المستخدم</label>
                        <input type="text" name="username" placeholder="admin" class="input-field" required autocomplete="username">
                    </div>
                    <div>
                        <label class="input-label">🔒 كلمة المرور</label>
                        <input type="password" name="password" placeholder="••••••••" class="input-field" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary w-full justify-center">
                        <i class="fas fa-sign-in-alt"></i>
                        تسجيل الدخول
                    </button>
                </form>

                <div class="mt-6 p-4 bg-blue-50 rounded-xl text-sm text-blue-800 text-center">
                    <strong>للتجربة:</strong> admin / admin123
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
