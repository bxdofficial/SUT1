version: "3.9"

services:
  party-magic:
    build: .
    container_name: party-magic-app
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./party.db:/app/party.db
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

